# Baseline hardening controls.
#
# Each control describes a desired state of a testbed service. The Assessor
# evaluates every control against the running testbed and emits a Finding for
# each deviation.
#
# The controls cover standard IT components found in critical-infrastructure
# organisations (energy, healthcare, finance, public administration, transport):
# identity, storage, exposed applications, remote administration, containers and
# network segmentation.
#
# Fields
#   id                       Stable identifier, referenced by Findings and the audit trail.
#   title                    Human-readable statement of the desired state.
#   source                   Reference framework(s): ISO/IEC 27001:2022 Annex A, NIST SP 800-53
#                            Rev. 5, CIS Controls v8, CIS Benchmarks. Documentary label only: it is
#                            NOT used by the agent and does not claim a verified control-by-control
#                            mapping. The NIS2 Directive (EU) 2022/2555 (Art. 21, cybersecurity
#                            risk-management measures) is a general framework reference for the whole
#                            baseline, not a per-control mapping.
#   target_service           Testbed service the control applies to ("*" = every container).
#   check_type               Name of the Assessor check implementation. All current controls use
#                            status_field: read the service's GET /status (JSON) and evaluate
#                            params.assertions against it.
#   params.assertions        List of {field, operator, expected}. `field` is a dotted path into the
#                            /status JSON. Operators: eq, gte, not_in, version_gte, mode_at_most (octal
#                            file mode with no bits beyond `expected`).
#   allowed_action_classes   action_class values (see risk_taxonomy.yaml) the Planner may
#                            propose for this control. Anything else is rejected by the PolicyEngine.
#
# Testbed services (testbed/docker-compose.yml), all exposing GET /status on port 8080:
#   vuln-web          Exposed web application (admin login, debug console, TLS, Python packages)
#   identity-service  Identity / authentication service (password policy, MFA)
#   storage-service   Storage service holding sensitive data (encryption at rest, config file)
#   bastion           SSH jump host used for administration across network zones
#
# Network zones: frontend (exposed; vuln-web, bastion) and internal (internal services;
# identity-service and storage-service are attached to this network only).

schema_version: 1

controls:
  - id: BC-001
    title: Default credentials must not be accepted by exposed web applications
    source: CIS Controls v8 (4.7); NIST SP 800-53 Rev. 5 (IA-5)
    target_service: vuln-web
    check_type: status_field
    params:
      assertions:
        - { field: admin_password_is_default, operator: eq, expected: false }
    allowed_action_classes: [rotate_credential]

  - id: BC-002
    title: Administrative debug ports must not be reachable from application or internal networks
    source: CIS Controls v8 (4.4); NIST SP 800-53 Rev. 5 (SC-7); ISO/IEC 27001:2022 (A.8.22)
    target_service: vuln-web
    check_type: status_field
    params:
      admin_ports:
        - { port: 9000, protocol: tcp, description: debug console }
      forbidden_from_networks: [frontend, internal]
      assertions:
        - { field: debug_port.enabled, operator: eq, expected: false }
    allowed_action_classes: [close_exposed_port]

  - id: BC-003
    title: TLS certificates must not use weak signature algorithms
    source: CIS Controls v8 (3.10); NIST SP 800-53 Rev. 5 (SC-13); ISO/IEC 27001:2022 (A.8.24)
    target_service: vuln-web
    check_type: status_field
    params:
      assertions:
        - field: tls.signature_algorithm
          operator: not_in
          expected: [md5WithRSAEncryption, sha1WithRSAEncryption]
    allowed_action_classes: [update_crypto_config]

  - id: BC-004
    title: Storage holding sensitive data must be encrypted at rest
    source: CIS Controls v8 (3.11); NIST SP 800-53 Rev. 5 (SC-28); ISO/IEC 27001:2022 (A.8.24)
    target_service: storage-service
    check_type: status_field
    params:
      assertions:
        - { field: encryption_at_rest, operator: eq, expected: true }
    allowed_action_classes: [enforce_storage_encryption]

  - id: BC-005
    title: SSH password authentication must be disabled
    source: CIS Benchmark for Linux (SSH Server Configuration); CIS Controls v8 (5.2)
    target_service: bastion
    check_type: status_field
    params:
      config_path: /etc/ssh/sshd_config
      assertions:
        - { field: ssh.effective_password_authentication, operator: eq, expected: "no" }
    allowed_action_classes: [change_ssh_policy]

  - id: BC-006
    title: The identity service must enforce a minimum password length and require MFA
    source: CIS Controls v8 (5.2, 6.5); NIST SP 800-53 Rev. 5 (IA-2(1), IA-5); ISO/IEC 27001:2022 (A.5.17)
    target_service: identity-service
    check_type: status_field
    params:
      assertions:
        - { field: auth_policy.password_min_length, operator: gte, expected: 12 }
        - { field: auth_policy.mfa_required, operator: eq, expected: true }
    allowed_action_classes: [change_auth_policy]

  - id: BC-007
    title: Containers must not run in privileged mode
    source: CIS Docker Benchmark (5.4)
    target_service: "*"
    check_type: status_field
    params:
      assertions:
        - { field: runtime.privileged, operator: eq, expected: false }
    allowed_action_classes: [remove_privileged_mode]

  - id: BC-008
    title: Storage configuration files must not be readable by other users
    source: CIS Benchmark for Linux (File Permissions); CIS Controls v8 (3.3)
    target_service: storage-service
    check_type: status_field
    params:
      assertions:
        - { field: config_file.mode, operator: mode_at_most, expected: "0640" }
        - { field: config_file.owner, operator: eq, expected: root }
    allowed_action_classes: [restrict_file_permissions]

  - id: BC-009
    title: Installed packages must not include known-vulnerable versions
    source: CIS Controls v8 (7.4); NIST SP 800-53 Rev. 5 (SI-2); ISO/IEC 27001:2022 (A.8.8)
    target_service: vuln-web
    check_type: status_field
    params:
      assertions:
        # Werkzeug < 3.0.6 is affected by CVE-2024-34069 (fixed in 3.0.3) and CVE-2024-49767.
        - { field: packages.werkzeug, operator: version_gte, expected: "3.0.6" }
    allowed_action_classes: [apply_package_update]
